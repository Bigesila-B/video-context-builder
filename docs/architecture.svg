<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 682" width="680" height="682" role="img">
<title>video-context-builder 处理流水线</title>
<desc>视频先探测元数据，再规划采样与 token 预算；随后分两路取帧：总览层每 2 到 5 秒抽 1 帧拼成 4x4 用于定位，秒图层在关键秒内抽 6 帧拼成 3x2 用于看清；最后拼图携带时间戳、可选 STT、生成约束型提示词，输出 JSON 供只支持图片的多模态模型消费。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="340" y="26" text-anchor="middle" font-size="15" font-weight="500" fill="#2C2C2A" font-family="sans-serif">video-context-builder · 处理流水线</text>

<rect x="200" y="44" width="280" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="66" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A" font-family="sans-serif">视频文件</text>
<line x1="340" y1="88" x2="340" y2="112" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="200" y="112" width="280" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="134" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C" font-family="sans-serif">① probe_video · 元数据探测</text>
<text x="340" y="154" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5" font-family="sans-serif">时长 / 帧率 / 分辨率 / 有无音轨</text>
<line x1="340" y1="172" x2="340" y2="196" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="200" y="196" width="280" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="218" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C" font-family="sans-serif">② 采样规划 + token 预算</text>
<text x="340" y="238" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5" font-family="sans-serif">超限则自动降级，并明确提醒</text>

<line x1="340" y1="256" x2="340" y2="272" stroke="#888780" stroke-width="1.5"/>
<line x1="190" y1="272" x2="490" y2="272" stroke="#888780" stroke-width="1.5"/>
<line x1="190" y1="272" x2="190" y2="286" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="490" y1="272" x2="490" y2="286" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="60" y="286" width="260" height="84" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="190" y="308" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806" font-family="sans-serif">总览层 · 负责定位</text>
<text x="190" y="330" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B" font-family="sans-serif">每 2–5 秒抽 1 帧 → 4x4 拼图</text>
<text x="190" y="350" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B" font-family="sans-serif">覆盖全片</text>

<rect x="360" y="286" width="260" height="84" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="490" y="308" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806" font-family="sans-serif">秒图层 · 负责看清</text>
<text x="490" y="330" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B" font-family="sans-serif">1 秒内抽 6 帧 → 3x2 拼图</text>
<text x="490" y="350" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B" font-family="sans-serif">只给关键秒</text>

<line x1="190" y1="370" x2="190" y2="390" stroke="#888780" stroke-width="1.5"/>
<line x1="490" y1="370" x2="490" y2="390" stroke="#888780" stroke-width="1.5"/>
<line x1="190" y1="390" x2="490" y2="390" stroke="#888780" stroke-width="1.5"/>
<line x1="340" y1="390" x2="340" y2="412" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="200" y="412" width="280" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="434" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C" font-family="sans-serif">③ 拼图 build_sheet</text>
<text x="340" y="454" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5" font-family="sans-serif">每格带时间戳标签 · 自动收缩空行</text>
<line x1="340" y1="472" x2="340" y2="496" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="200" y="496" width="280" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="518" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C" font-family="sans-serif">④ STT（可选）+ 提示词构造</text>
<text x="340" y="538" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5" font-family="sans-serif">带时间戳转写 · 约束型提示词</text>
<line x1="340" y1="556" x2="340" y2="580" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="200" y="580" width="280" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="602" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A" font-family="sans-serif">out.json</text>
<text x="340" y="622" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441" font-family="sans-serif">图片 + 文本 → 只支持图片的模型</text>

<text x="340" y="664" text-anchor="middle" font-size="12" fill="#5F5E5A" font-family="sans-serif">关键秒只取自：场景切换 · 语音活动 · 用户指定区间 —— 默认不对全片出秒图</text>
</svg>
